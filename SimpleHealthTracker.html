<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人体重与饮食记录</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --border: #e5e7eb;
      --danger: #dc2626;
      --ok: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    h1, h2, h3 { margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: 14px; }
    .tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 16px 0 20px;
    }
    .tab-btn, button {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.04);
    }
    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 14px;
      color: var(--muted);
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 14px;
      background: #fff;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .row-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin: 12px 0;
    }
    .list {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }
    .item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: #fff;
    }
    .item-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: #eff6ff;
      color: var(--primary);
      margin-right: 6px;
      margin-top: 6px;
    }
    .img-preview {
      width: 92px;
      height: 92px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f3f4f6;
    }
    .item-layout {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
    }
    .danger {
      color: #fff;
      background: var(--danger);
      border-color: var(--danger);
    }
    .ok {
      color: #fff;
      background: var(--ok);
      border-color: var(--ok);
    }
    .hidden { display: none; }
    .summary-box {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }
    .summary-item {
      padding: 12px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid var(--border);
    }
    @media (max-width: 760px) {
      .row, .row-4 { grid-template-columns: 1fr; }
      .item-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>个人体重与饮食记录</h1>
    <div class="muted">单文件版本，数据保存在浏览器本地。支持：体重记录、食物库、自定义热量与三大营养素、饮食记录、图片上传。</div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="dashboard">首页</button>
      <button class="tab-btn" data-tab="foods">食物库</button>
      <button class="tab-btn" data-tab="diet">饮食记录</button>
      <button class="tab-btn" data-tab="weight">体重记录</button>
    </div>

    <section id="dashboard" class="tab-panel">
      <div class="grid">
        <div class="card">
          <h2>今日汇总</h2>
          <div class="muted" id="todayText"></div>
          <div class="summary-box" id="todaySummary"></div>
        </div>
        <div class="card">
          <h2>基础统计</h2>
          <div class="summary-box" id="basicStats"></div>
        </div>
      </div>
    </section>

    <section id="foods" class="tab-panel hidden">
      <div class="grid">
        <div class="card">
          <h2>新增 / 编辑食物</h2>
          <input type="hidden" id="foodId" />
          <label>食物名称</label>
          <input id="foodName" placeholder="例如：鸡胸肉" />
          <div class="row-4">
            <div>
              <label>每100g热量(kcal)</label>
              <input id="foodCalories" type="number" min="0" step="0.1" />
            </div>
            <div>
              <label>蛋白质(g)</label>
              <input id="foodProtein" type="number" min="0" step="0.1" />
            </div>
            <div>
              <label>脂肪(g)</label>
              <input id="foodFat" type="number" min="0" step="0.1" />
            </div>
            <div>
              <label>碳水(g)</label>
              <input id="foodCarbs" type="number" min="0" step="0.1" />
            </div>
          </div>
          <label>食物图片（可选）</label>
          <input id="foodImage" type="file" accept="image/*" />
          <div class="toolbar">
            <button class="ok" id="saveFoodBtn">保存食物</button>
            <button id="resetFoodBtn">清空表单</button>
          </div>
        </div>

        <div class="card">
          <h2>食物列表</h2>
          <label>搜索</label>
          <input id="foodSearch" placeholder="输入名称筛选" />
          <div class="list" id="foodList"></div>
        </div>
      </div>
    </section>

    <section id="diet" class="tab-panel hidden">
      <div class="grid">
        <div class="card">
          <h2>新增饮食记录</h2>
          <label>日期</label>
          <input id="dietDate" type="date" />
          <label>选择食物</label>
          <select id="dietFood"></select>
          <div class="row">
            <div>
              <label>食用克数(g)</label>
              <input id="dietGrams" type="number" min="1" step="1" value="100" />
            </div>
            <div>
              <label>餐次</label>
              <select id="dietMealType">
                <option value="早餐">早餐</option>
                <option value="午餐">午餐</option>
                <option value="晚餐">晚餐</option>
                <option value="加餐">加餐</option>
              </select>
            </div>
          </div>
          <label>图片（可选）</label>
          <input id="dietImage" type="file" accept="image/*" />
          <label>备注</label>
          <textarea id="dietNote" rows="3" placeholder="可选"></textarea>
          <div class="toolbar">
            <button class="ok" id="saveDietBtn">保存饮食记录</button>
          </div>
          <div class="muted" id="dietPreview"></div>
        </div>

        <div class="card">
          <h2>饮食记录列表</h2>
          <label>按日期查看</label>
          <input id="dietFilterDate" type="date" />
          <div class="summary-box" id="dietDaySummary"></div>
          <div class="list" id="dietList"></div>
        </div>
      </div>
    </section>

    <section id="weight" class="tab-panel hidden">
      <div class="grid">
        <div class="card">
          <h2>新增体重记录</h2>
          <label>日期</label>
          <input id="weightDate" type="date" />
          <label>体重(kg)</label>
          <input id="weightValue" type="number" min="0" step="0.1" />
          <label>图片（可选）</label>
          <input id="weightImage" type="file" accept="image/*" />
          <label>备注</label>
          <textarea id="weightNote" rows="3" placeholder="可选"></textarea>
          <div class="toolbar">
            <button class="ok" id="saveWeightBtn">保存体重记录</button>
          </div>
        </div>

        <div class="card">
          <h2>体重记录列表</h2>
          <div class="list" id="weightList"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'simple_health_tracker_v1';

    const state = loadState();
    ensureSeedData();
    setDefaultDates();
    bindTabs();
    bindEvents();
    refreshAll();

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          return JSON.parse(raw);
        } catch (_) {}
      }
      return {
        foods: [],
        dietLogs: [],
        weightLogs: []
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function ensureSeedData() {
      if (state.foods.length > 0) return;
      state.foods = [
        { id: uid(), name: '鸡胸肉', calories: 133, protein: 27.0, fat: 3.0, carbs: 0.0, image: '' },
        { id: uid(), name: '米饭', calories: 116, protein: 2.6, fat: 0.3, carbs: 25.9, image: '' },
        { id: uid(), name: '鸡蛋', calories: 144, protein: 13.3, fat: 8.8, carbs: 2.8, image: '' },
      ];
      saveState();
    }

    function setDefaultDates() {
      const today = new Date().toISOString().slice(0, 10);
      byId('dietDate').value = today;
      byId('dietFilterDate').value = today;
      byId('weightDate').value = today;
    }

    function bindTabs() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
          document.querySelectorAll('.tab-panel').forEach(x => x.classList.add('hidden'));
          btn.classList.add('active');
          byId(btn.dataset.tab).classList.remove('hidden');
        });
      });
    }

    function bindEvents() {
      byId('saveFoodBtn').addEventListener('click', saveFood);
      byId('resetFoodBtn').addEventListener('click', resetFoodForm);
      byId('foodSearch').addEventListener('input', renderFoods);
      byId('saveDietBtn').addEventListener('click', saveDietLog);
      byId('saveWeightBtn').addEventListener('click', saveWeightLog);
      byId('dietFood').addEventListener('change', renderDietPreview);
      byId('dietGrams').addEventListener('input', renderDietPreview);
      byId('dietFilterDate').addEventListener('change', () => {
        renderDietLogs();
        renderDashboard();
      });
    }

    async function saveFood() {
      const id = byId('foodId').value;
      const name = byId('foodName').value.trim();
      const calories = num(byId('foodCalories').value);
      const protein = num(byId('foodProtein').value);
      const fat = num(byId('foodFat').value);
      const carbs = num(byId('foodCarbs').value);
      const file = byId('foodImage').files[0];

      if (!name) return alert('请输入食物名称');
      if ([calories, protein, fat, carbs].some(v => v < 0 || Number.isNaN(v))) {
        return alert('请正确填写热量与三大营养素');
      }

      const image = file ? await fileToBase64(file) : '';
      if (id) {
        const item = state.foods.find(f => f.id === id);
        if (!item) return;
        item.name = name;
        item.calories = calories;
        item.protein = protein;
        item.fat = fat;
        item.carbs = carbs;
        if (image) item.image = image;
      } else {
        state.foods.unshift({ id: uid(), name, calories, protein, fat, carbs, image });
      }

      saveState();
      resetFoodForm();
      refreshAll();
      alert('食物已保存');
    }

    function resetFoodForm() {
      byId('foodId').value = '';
      byId('foodName').value = '';
      byId('foodCalories').value = '';
      byId('foodProtein').value = '';
      byId('foodFat').value = '';
      byId('foodCarbs').value = '';
      byId('foodImage').value = '';
    }

    async function saveDietLog() {
      const date = byId('dietDate').value;
      const foodId = byId('dietFood').value;
      const grams = num(byId('dietGrams').value);
      const mealType = byId('dietMealType').value;
      const note = byId('dietNote').value.trim();
      const file = byId('dietImage').files[0];
      const food = state.foods.find(f => f.id === foodId);

      if (!date) return alert('请选择日期');
      if (!food) return alert('请先选择食物');
      if (grams <= 0) return alert('请输入正确的克数');

      const factor = grams / 100;
      const image = file ? await fileToBase64(file) : '';

      state.dietLogs.unshift({
        id: uid(),
        date,
        foodId: food.id,
        foodName: food.name,
        grams,
        mealType,
        note,
        image,
        calories: round1(food.calories * factor),
        protein: round1(food.protein * factor),
        fat: round1(food.fat * factor),
        carbs: round1(food.carbs * factor),
        createdAt: Date.now()
      });

      saveState();
      byId('dietImage').value = '';
      byId('dietNote').value = '';
      byId('dietGrams').value = '100';
      renderDietPreview();
      refreshAll();
      alert('饮食记录已保存');
    }

    async function saveWeightLog() {
      const date = byId('weightDate').value;
      const weight = num(byId('weightValue').value);
      const note = byId('weightNote').value.trim();
      const file = byId('weightImage').files[0];

      if (!date) return alert('请选择日期');
      if (weight <= 0) return alert('请输入正确的体重');

      const image = file ? await fileToBase64(file) : '';
      state.weightLogs.unshift({ id: uid(), date, weight, note, image, createdAt: Date.now() });
      saveState();
      byId('weightValue').value = '';
      byId('weightImage').value = '';
      byId('weightNote').value = '';
      refreshAll();
      alert('体重记录已保存');
    }

    function refreshAll() {
      renderFoodOptions();
      renderFoods();
      renderDietPreview();
      renderDietLogs();
      renderWeightLogs();
      renderDashboard();
    }

    function renderFoodOptions() {
      const select = byId('dietFood');
      const current = select.value;
      select.innerHTML = state.foods.length
        ? state.foods.map(f => `<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('')
        : '<option value="">请先新增食物</option>';
      if (state.foods.some(f => f.id === current)) select.value = current;
      renderDietPreview();
    }

    function renderFoods() {
      const keyword = byId('foodSearch').value.trim().toLowerCase();
      const list = state.foods.filter(f => f.name.toLowerCase().includes(keyword));
      byId('foodList').innerHTML = list.length ? list.map(f => `
        <div class="item">
          <div class="item-layout">
            <div>
              <div class="item-head">
                <div>
                  <strong>${escapeHtml(f.name)}</strong>
                  <div class="muted">每100g</div>
                </div>
                <div>
                  <button onclick="editFood('${f.id}')">编辑</button>
                  <button class="danger" onclick="deleteFood('${f.id}')">删除</button>
                </div>
              </div>
              <span class="badge">热量 ${f.calories} kcal</span>
              <span class="badge">蛋白 ${f.protein} g</span>
              <span class="badge">脂肪 ${f.fat} g</span>
              <span class="badge">碳水 ${f.carbs} g</span>
            </div>
            ${f.image ? `<img class="img-preview" src="${f.image}" alt="food" />` : ''}
          </div>
        </div>
      `).join('') : '<div class="muted">暂无食物数据</div>';
    }

    function renderDietPreview() {
      const food = state.foods.find(f => f.id === byId('dietFood').value);
      const grams = num(byId('dietGrams').value || 0);
      if (!food || grams <= 0) {
        byId('dietPreview').textContent = '选择食物并填写克数后，将自动预览热量与三大营养素。';
        return;
      }
      const factor = grams / 100;
      byId('dietPreview').textContent = `本次预计：热量 ${round1(food.calories * factor)} kcal，蛋白 ${round1(food.protein * factor)} g，脂肪 ${round1(food.fat * factor)} g，碳水 ${round1(food.carbs * factor)} g。`;
    }

    function renderDietLogs() {
      const date = byId('dietFilterDate').value;
      const logs = state.dietLogs
        .filter(x => !date || x.date === date)
        .sort((a, b) => b.createdAt - a.createdAt);

      const sum = logs.reduce((acc, x) => {
        acc.calories += x.calories;
        acc.protein += x.protein;
        acc.fat += x.fat;
        acc.carbs += x.carbs;
        return acc;
      }, { calories: 0, protein: 0, fat: 0, carbs: 0 });

      byId('dietDaySummary').innerHTML = [
        ['热量', `${round1(sum.calories)} kcal`],
        ['蛋白', `${round1(sum.protein)} g`],
        ['脂肪', `${round1(sum.fat)} g`],
        ['碳水', `${round1(sum.carbs)} g`],
      ].map(([k, v]) => `<div class="summary-item"><div class="muted">${k}</div><strong>${v}</strong></div>`).join('');

      byId('dietList').innerHTML = logs.length ? logs.map(x => `
        <div class="item">
          <div class="item-layout">
            <div>
              <div class="item-head">
                <div>
                  <strong>${escapeHtml(x.foodName)}</strong>
                  <div class="muted">${x.date} · ${escapeHtml(x.mealType)} · ${x.grams} g</div>
                </div>
                <button class="danger" onclick="deleteDietLog('${x.id}')">删除</button>
              </div>
              <span class="badge">${x.calories} kcal</span>
              <span class="badge">蛋白 ${x.protein} g</span>
              <span class="badge">脂肪 ${x.fat} g</span>
              <span class="badge">碳水 ${x.carbs} g</span>
              ${x.note ? `<div class="muted" style="margin-top:8px;">备注：${escapeHtml(x.note)}</div>` : ''}
            </div>
            ${x.image ? `<img class="img-preview" src="${x.image}" alt="diet" />` : ''}
          </div>
        </div>
      `).join('') : '<div class="muted">该日期暂无饮食记录</div>';
    }

    function renderWeightLogs() {
      const logs = [...state.weightLogs].sort((a, b) => b.createdAt - a.createdAt);
      byId('weightList').innerHTML = logs.length ? logs.map(x => `
        <div class="item">
          <div class="item-layout">
            <div>
              <div class="item-head">
                <div>
                  <strong>${x.weight} kg</strong>
                  <div class="muted">${x.date}</div>
                </div>
                <button class="danger" onclick="deleteWeightLog('${x.id}')">删除</button>
              </div>
              ${x.note ? `<div class="muted">备注：${escapeHtml(x.note)}</div>` : ''}
            </div>
            ${x.image ? `<img class="img-preview" src="${x.image}" alt="weight" />` : ''}
          </div>
        </div>
      `).join('') : '<div class="muted">暂无体重记录</div>';
    }

    function renderDashboard() {
      const today = byId('dietFilterDate').value || new Date().toISOString().slice(0, 10);
      byId('todayText').textContent = `统计日期：${today}`;

      const todayDiet = state.dietLogs.filter(x => x.date === today);
      const todayWeight = [...state.weightLogs].filter(x => x.date === today).sort((a, b) => b.createdAt - a.createdAt)[0];

      const sum = todayDiet.reduce((acc, x) => {
        acc.calories += x.calories;
        acc.protein += x.protein;
        acc.fat += x.fat;
        acc.carbs += x.carbs;
        return acc;
      }, { calories: 0, protein: 0, fat: 0, carbs: 0 });

      byId('todaySummary').innerHTML = [
        ['今日热量', `${round1(sum.calories)} kcal`],
        ['今日蛋白', `${round1(sum.protein)} g`],
        ['今日脂肪', `${round1(sum.fat)} g`],
        ['今日碳水', `${round1(sum.carbs)} g`],
        ['今日体重', todayWeight ? `${todayWeight.weight} kg` : '未记录'],
      ].map(([k, v]) => `<div class="summary-item"><div class="muted">${k}</div><strong>${v}</strong></div>`).join('');

      const latestWeight = [...state.weightLogs].sort((a, b) => b.createdAt - a.createdAt)[0];
      byId('basicStats').innerHTML = [
        ['食物数量', `${state.foods.length} 个`],
        ['饮食记录', `${state.dietLogs.length} 条`],
        ['体重记录', `${state.weightLogs.length} 条`],
        ['最近体重', latestWeight ? `${latestWeight.weight} kg` : '暂无'],
      ].map(([k, v]) => `<div class="summary-item"><div class="muted">${k}</div><strong>${v}</strong></div>`).join('');
    }

    function editFood(id) {
      const f = state.foods.find(x => x.id === id);
      if (!f) return;
      byId('foodId').value = f.id;
      byId('foodName').value = f.name;
      byId('foodCalories').value = f.calories;
      byId('foodProtein').value = f.protein;
      byId('foodFat').value = f.fat;
      byId('foodCarbs').value = f.carbs;
      document.querySelector('[data-tab="foods"]').click();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteFood(id) {
      const used = state.dietLogs.some(x => x.foodId === id);
      if (used) {
        alert('该食物已被饮食记录使用，当前版本不允许直接删除。可先删除相关饮食记录。');
        return;
      }
      if (!confirm('确定删除该食物吗？')) return;
      state.foods = state.foods.filter(x => x.id !== id);
      saveState();
      refreshAll();
    }

    function deleteDietLog(id) {
      if (!confirm('确定删除该饮食记录吗？')) return;
      state.dietLogs = state.dietLogs.filter(x => x.id !== id);
      saveState();
      refreshAll();
    }

    function deleteWeightLog(id) {
      if (!confirm('确定删除该体重记录吗？')) return;
      state.weightLogs = state.weightLogs.filter(x => x.id !== id);
      saveState();
      refreshAll();
    }

    function byId(id) { return document.getElementById(id); }
    function num(v) { return Number(v); }
    function round1(v) { return Math.round(v * 10) / 10; }
    function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    window.editFood = editFood;
    window.deleteFood = deleteFood;
    window.deleteDietLog = deleteDietLog;
    window.deleteWeightLog = deleteWeightLog;
  </script>
</body>
</html>
